<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <clipPath id="snapback-front-print-area">
      <path d="M130 95 C135 50, 190 30, 250 26 C310 30, 365 50, 370 95 L375 204 C370 218, 310 228, 250 230 C190 228, 130 218, 125 204 Z"/>
    </clipPath>
    <filter id="snapback-front-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#snapback-front-shadow)">
    <g stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <!-- Crown — structured, tall panels -->
      <path d="M108 212 C104 150, 112 95, 132 68 C162 32, 202 18, 250 14 C298 18, 338 32, 368 68 C388 95, 396 150, 392 212"/>

      <!-- Top button -->
      <circle cx="250" cy="14" r="6" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <circle cx="250" cy="14" r="3" stroke="rgba(255,255,255,0.15)" stroke-width="0.75"/>

      <!-- Panel seams (6-panel — lines radiating from button to brim) -->
      <path d="M250 20 C250 80, 250 150, 250 212" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="6 4"/>
      <path d="M180 28 C172 90, 164 150, 160 212" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="6 4"/>
      <path d="M320 28 C328 90, 336 150, 340 212" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="6 4"/>

      <!-- Brim — flat, structured (snapback style) -->
      <path d="M108 212 C102 218, 88 238, 82 258 C76 278, 84 292, 98 302 C138 326, 194 336, 250 338 C306 336, 362 326, 402 302 C416 292, 424 278, 418 258 C412 238, 398 218, 392 212"/>

      <!-- Brim top edge / seam where crown meets brim -->
      <path d="M108 212 C160 226, 340 226, 392 212" stroke="rgba(255,255,255,0.2)"/>

      <!-- Brim underside shadow line -->
      <path d="M96 284 C160 310, 340 310, 404 284" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

      <!-- Brim edge stitching -->
      <path d="M86 268 C160 296, 340 296, 414 268" stroke="rgba(255,255,255,0.08)" stroke-width="0.75" stroke-dasharray="3 2"/>

      <!-- Sweatband line -->
      <path d="M112 218 C170 230, 330 230, 388 218" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4 3"/>

      <!-- Eyelet holes on side panels -->
      <circle cx="172" cy="72" r="4" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <circle cx="250" cy="62" r="4" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <circle cx="328" cy="72" r="4" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    </g>
  </g>
</svg>

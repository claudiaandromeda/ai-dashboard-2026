<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" fill="none">
  <defs>
    <clipPath id="phonecase-print-area">
      <rect x="25" y="25" width="250" height="550" rx="36"/>
    </clipPath>
    <filter id="phonecase-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#phonecase-shadow)">
    <g stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

      <!-- Case outer shape -->
      <rect x="18" y="18" width="264" height="564" rx="40" ry="40"/>

      <!-- Inner bezel edge -->
      <rect x="26" y="26" width="248" height="548" rx="34" ry="34" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

      <!-- Screen edge line -->
      <rect x="32" y="58" width="236" height="490" rx="20" ry="20" stroke="rgba(255,255,255,0.08)" stroke-width="0.75"/>

      <!-- Camera module cutout (top-left, iPhone 15 Pro style) -->
      <rect x="32" y="32" width="100" height="100" rx="22" ry="22" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <!-- Main lenses (2 circles) -->
      <circle cx="58" cy="58" r="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <circle cx="58" cy="58" r="8" stroke="rgba(255,255,255,0.12)" stroke-width="0.75"/>
      <circle cx="108" cy="58" r="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <circle cx="108" cy="58" r="8" stroke="rgba(255,255,255,0.12)" stroke-width="0.75"/>
      <!-- Ultra-wide (pill shape, bottom) -->
      <rect x="46" y="92" width="38" height="26" rx="13" ry="13" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
      <!-- Flash + LiDAR -->
      <circle cx="108" cy="105" r="6" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <circle cx="124" cy="82" r="3" stroke="rgba(255,255,255,0.1)" stroke-width="0.75"/>

      <!-- Volume buttons (left side) -->
      <path d="M18 158 C14 158, 14 172, 18 172" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <path d="M18 184 C14 184, 14 222, 18 222" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <path d="M18 234 C14 234, 14 272, 18 272" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

      <!-- Power button (right side) -->
      <path d="M282 210 C286 210, 286 270, 282 270" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

      <!-- Bottom port cutout -->
      <path d="M130 580 C140 583, 160 583, 170 580" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

      <!-- Speaker grilles -->
      <circle cx="115" cy="580" r="2" stroke="rgba(255,255,255,0.08)" stroke-width="0.75"/>
      <circle cx="108" cy="580" r="2" stroke="rgba(255,255,255,0.08)" stroke-width="0.75"/>
      <circle cx="185" cy="580" r="2" stroke="rgba(255,255,255,0.08)" stroke-width="0.75"/>
      <circle cx="192" cy="580" r="2" stroke="rgba(255,255,255,0.08)" stroke-width="0.75"/>
    </g>
  </g>
</svg>
